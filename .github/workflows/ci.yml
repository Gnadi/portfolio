name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `npm run build` is `astro check && astro build`, so this covers the
      # type check and the production build in one step — including the
      # content-collection schemas and every page's structured data.
      - run: npm run build
